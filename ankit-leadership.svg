<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <style>
    .title { font-family: 'Orbitron', 'Segoe UI', monospace; font-weight: 900; fill: #ffd700; font-size: 13px; letter-spacing: 2px; }
    .subtitle { font-family: 'Segoe UI', sans-serif; font-weight: 700; fill: #ffffff; font-size: 11px; letter-spacing: 1px; }
    .body { font-family: 'Segoe UI', sans-serif; fill: #a3a3a3; font-size: 11px; }
    .glow-gold { stroke: #ffd700; filter: url(#glow); }
    .time-node { fill: #ffd700; filter: url(#glow); }
  </style>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Dark Background (No stroke/border to keep it borderless, but ensures text is visible on light themes) -->
  <rect width="800" height="220" rx="12" fill="#06080c" />

  <!-- Central Vertical Timeline Stem -->
  <line x1="400" y1="10" x2="400" y2="210" stroke="#1c2438" stroke-width="3" />
  <line x1="400" y1="20" x2="400" y2="200" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4 4" class="glow-gold" />

  <!-- ==================== LEFT NODE: ROBOTICS CLUB ==================== -->
  <circle cx="400" cy="65" r="7" fill="#06080c" stroke="#ffd700" stroke-width="2" class="time-node" />
  <circle cx="400" cy="65" r="3" fill="#ffffff" />
  
  <path d="M 400 65 L 360 65 L 340 65" fill="none" stroke="#ffd700" stroke-width="1.5" class="glow-gold" />
  <circle cx="340" cy="65" r="4" fill="#ffaa00" />

  <g transform="translate(325, 25)" text-anchor="end">
    <text x="0" y="15" class="title">ROBOTICS CLUB EXECUTIVE</text>
    <text x="0" y="32" class="subtitle">Robotics Club, MANIT | May 2024 - Present</text>
    
    <text x="0" y="60" class="body">Orchestrated Automax, Makeathon &amp; Roborace (300+ attendees) •</text>
    <text x="0" y="78" class="body">Directed technical robotics logistics and on-ground executions •</text>
    <text x="0" y="96" class="body">Managed resource budgets and cross-functional task planning •</text>
  </g>

  <!-- ==================== RIGHT NODE: PLACEMENT CELL ==================== -->
  <circle cx="400" cy="145" r="7" fill="#06080c" stroke="#ffd700" stroke-width="2" class="time-node" />
  <circle cx="400" cy="145" r="3" fill="#ffffff" />
  
  <path d="M 400 145 L 440 145 L 460 145" fill="none" stroke="#ffd700" stroke-width="1.5" class="glow-gold" />
  <circle cx="460" cy="145" r="4" fill="#ffaa00" />

  <g transform="translate(475, 105)" text-anchor="start">
    <text x="0" y="15" class="title">PLACEMENT COORDINATOR</text>
    <text x="0" y="32" class="subtitle">Training &amp; Placement Cell | Feb 2026 - Present</text>
    
    <text x="0" y="60" class="body">• Handled campus recruitment pipelines for 300+ candidates</text>
    <text x="0" y="78" class="body">• Built structured database of 200+ HR professionals</text>
    <text x="0" y="96" class="body">• Accelerated corporate outreach drives via LinkedIn</text>
  </g>
</svg>
