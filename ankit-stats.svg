<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <style>
    .title { font-family: 'Orbitron', 'Segoe UI', monospace; font-weight: 900; fill: #ffd700; font-size: 14px; letter-spacing: 2px; }
    .label { font-family: 'Segoe UI', sans-serif; font-weight: 600; fill: #a3a3a3; font-size: 11px; letter-spacing: 1px; }
    .value { font-family: 'Orbitron', 'Segoe UI', monospace; font-weight: 800; fill: #ffffff; font-size: 20px; }
    .tier-text { font-family: 'Orbitron', sans-serif; font-weight: 700; fill: #ffd700; font-size: 11px; letter-spacing: 1px; }
    .card-bg { fill: #0d1117; stroke: #262e3d; stroke-width: 1.5; }
  </style>

  <defs>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ffaa00" />
    </linearGradient>
  </defs>

  <rect width="800" height="240" rx="15" fill="#06080c" stroke="url(#gold-grad)" stroke-width="2" />
  <path d="M 0 40 L 800 40 M 0 80 L 800 80 M 0 120 L 800 120 M 0 160 L 800 160 M 0 200 L 800 200 M 200 0 L 200 240 M 400 0 L 400 240 M 600 0 L 600 240" stroke="#121620" stroke-width="1" />

  <text x="40" y="27" class="title">✦ ALGORITHMIC PERFORMANCE DIAGNOSTICS ✦</text>
  <line x1="40" y1="38" x2="760" y2="38" stroke="#1f2438" stroke-width="1.5" />

  <g transform="translate(40, 55)">
    <rect width="160" height="155" rx="10" class="card-bg" />
    <path d="M 10 0 L 150 0" stroke="#ffd700" stroke-width="2" stroke-linecap="round" filter="url(#glow-gold)" />
    <text x="80" y="25" class="label" text-anchor="middle">LEETCODE RATING</text>
    <text x="80" y="55" class="value" fill="#ffa116" text-anchor="middle">2007</text>
    <text x="80" y="75" class="tier-text" text-anchor="middle">GUARDIAN</text>
    <text x="80" y="95" class="label" text-anchor="middle">TOP 1.5% GLOBALLY</text>
    <circle cx="80" cy="125" r="18" fill="none" stroke="#222" stroke-width="3" />
    <circle cx="80" cy="125" r="18" fill="none" stroke="#ffd700" stroke-width="3" stroke-dasharray="113" stroke-dashoffset="2" stroke-linecap="round" filter="url(#glow-gold)" />
    <text x="80" y="129" font-family="'Orbitron', sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">98%</text>
  </g>

  <g transform="translate(220, 55)">
    <rect width="160" height="155" rx="10" class="card-bg" />
    <path d="M 10 0 L 150 0" stroke="#ffaa00" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <text x="80" y="25" class="label" text-anchor="middle">CODECHEF RATING</text>
    <text x="80" y="55" class="value" fill="#ff7b00" text-anchor="middle">1824</text>
    <text x="80" y="75" class="tier-text" fill="#ffaa00" text-anchor="middle">4-STAR</text>
    <text x="80" y="95" class="label" text-anchor="middle">DIVISION 1</text>
    <circle cx="80" cy="125" r="18" fill="none" stroke="#222" stroke-width="3" />
    <circle cx="80" cy="125" r="18" fill="none" stroke="#ffaa00" stroke-width="3" stroke-dasharray="113" stroke-dashoffset="15" stroke-linecap="round" />
    <text x="80" y="129" font-family="'Orbitron', sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">87%</text>
  </g>

  <g transform="translate(400, 55)">
    <rect width="160" height="155" rx="10" class="card-bg" />
    <path d="M 10 0 L 150 0" stroke="#ffd700" stroke-width="2" stroke-linecap="round" opacity="0.4" />
    <text x="80" y="25" class="label" text-anchor="middle">CODEFORCES</text>
    <text x="80" y="55" class="value" fill="#388e3c" text-anchor="middle">1515</text>
    <text x="80" y="75" class="tier-text" fill="#58a6ff" text-anchor="middle">SPECIALIST</text>
    <text x="80" y="95" class="label" text-anchor="middle">MAX RATING</text>
    <circle cx="80" cy="125" r="18" fill="none" stroke="#222" stroke-width="3" />
    <circle cx="80" cy="125" r="18" fill="none" stroke="#58a6ff" stroke-width="3" stroke-dasharray="113" stroke-dashoffset="35" stroke-linecap="round" />
    <text x="80" y="129" font-family="'Orbitron', sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">70%</text>
  </g>

  <g transform="translate(580, 55)">
    <rect width="180" height="155" rx="10" class="card-bg" />
    <path d="M 10 0 L 170 0" stroke="#ffd700" stroke-width="2" stroke-linecap="round" filter="url(#glow-gold)" />
    <text x="90" y="25" class="label" text-anchor="middle">DSA RESOLUTION INDEX</text>
    <text x="90" y="55" class="value" fill="#ffd700" font-size="22" text-anchor="middle" filter="url(#glow-gold)">650+</text>
    <text x="90" y="75" class="tier-text" text-anchor="middle">SOLVED PROBLEMS</text>
    <rect x="15" y="95" width="150" height="18" rx="4" fill="#070a13" stroke="#222" stroke-width="1" />
    <text x="25" y="108" font-family="'Segoe UI', sans-serif" font-size="9" fill="#888">SQL Solved: <tspan fill="#ffd700" font-weight="bold">100+ Queries</tspan></text>
    <rect x="15" y="120" width="150" height="18" rx="4" fill="#070a13" stroke="#222" stroke-width="1" />
    <text x="25" y="133" font-family="'Segoe UI', sans-serif" font-size="9" fill="#888">Hackathons: <tspan fill="#ffd700" font-weight="bold">Kriyeta 3rd | SIH '25</tspan></text>
  </g>
</svg>
