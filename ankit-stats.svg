<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <style>
    .title { font-family: 'Orbitron', 'Segoe UI', monospace; font-weight: 900; fill: #ffd700; font-size: 14px; letter-spacing: 2px; }
    .label { font-family: 'Segoe UI', sans-serif; font-weight: 600; fill: #a3a3a3; font-size: 11px; letter-spacing: 1px; }
    .value { font-family: 'Orbitron', 'Segoe UI', monospace; font-weight: 800; fill: #ffffff; font-size: 20px; }
    .tier-text { font-family: 'Orbitron', sans-serif; font-weight: 700; fill: #ffd700; font-size: 11px; letter-spacing: 1px; }
    .card-bg { fill: #0d1117; stroke: #262e3d; stroke-width: 1.5; }
  </style>

  <defs>
    <!-- Glowing gold filter -->
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ffaa00" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" rx="15" fill="#06080c" stroke="url(#gold-grad)" stroke-width="2" />
  
  <!-- Subtle grid pattern -->
  <path d="M 0 40 L 800 40 M 0 80 L 800 80 M 0 120 L 800 120 M 0 160 L 800 160 M 0 200 L 800 200 M 150 0 L 150 240 M 300 0 L 300 240 M 500 0 L 500 240 M 650 0 L 650 240" stroke="#121620" stroke-width="1" />

  <!-- Header Title -->
  <text x="40" y="27" class="title">✦ ALGORITHMIC PERFORMANCE DIAGNOSTICS ✦</text>
  <line x1="40" y1="38" x2="760" y2="38" stroke="#1f2438" stroke-width="1.5" />

  <!-- COLUMN 1: LEETCODE (Knight / 1984) -->
  <g transform="translate(50, 55)">
    <rect width="210" height="155" rx="10" class="card-bg" />
    <path d="M 10 0 L 200 0" stroke="#ffd700" stroke-width="2" stroke-linecap="round" filter="url(#glow-gold)" />
    
    <text x="105" y="25" class="label" text-anchor="middle">LEETCODE RATING</text>
    <text x="105" y="55" class="value" fill="#ffa116" text-anchor="middle">1984</text>
    <text x="105" y="75" class="tier-text" text-anchor="middle">KNIGHT</text>
    <text x="105" y="95" class="label" text-anchor="middle">TOP 2.81% GLOBALLY</text>
    
    <!-- Progress circle outline -->
    <circle cx="105" cy="125" r="18" fill="none" stroke="#222" stroke-width="3" />
    <!-- Progress circle filled -->
    <circle cx="105" cy="125" r="18" fill="none" stroke="#ffd700" stroke-width="3" stroke-dasharray="113" stroke-dashoffset="3" stroke-linecap="round" filter="url(#glow-gold)" />
    <text x="105" y="129" font-family="'Orbitron', sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">97%</text>
  </g>

  <!-- COLUMN 2: CODECHEF (4-Star / 1824) -->
  <g transform="translate(295, 55)">
    <rect width="210" height="155" rx="10" class="card-bg" />
    <path d="M 10 0 L 200 0" stroke="#ffaa00" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    
    <text x="105" y="25" class="label" text-anchor="middle">CODECHEF RATING</text>
    <text x="105" y="55" class="value" fill="#ff7b00" text-anchor="middle">1824</text>
    <text x="105" y="75" class="tier-text" fill="#ffaa00" text-anchor="middle">4-STAR</text>
    <text x="105" y="95" class="label" text-anchor="middle">DIVISION 1</text>
    
    <!-- Progress circle outline -->
    <circle cx="105" cy="125" r="18" fill="none" stroke="#222" stroke-width="3" />
    <!-- Progress circle filled -->
    <circle cx="105" cy="125" r="18" fill="none" stroke="#ffaa00" stroke-width="3" stroke-dasharray="113" stroke-dashoffset="15" stroke-linecap="round" />
    <text x="105" y="129" font-family="'Orbitron', sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">87%</text>
  </g>

  <!-- COLUMN 3: CODEFORCES (Specialist / 1515) -->
  <g transform="translate(540, 55)">
    <rect width="210" height="155" rx="10" class="card-bg" />
    <path d="M 10 0 L 200 0" stroke="#ffd700" stroke-width="2" stroke-linecap="round" opacity="0.4" />
    
    <text x="105" y="25" class="label" text-anchor="middle">CODEFORCES</text>
    <text x="105" y="55" class="value" fill="#388e3c" text-anchor="middle">1515</text>
    <text x="105" y="75" class="tier-text" fill="#58a6ff" text-anchor="middle">SPECIALIST</text>
    <text x="105" y="95" class="label" text-anchor="middle">MAX RATING</text>
    
    <!-- Progress circle outline -->
    <circle cx="105" cy="125" r="18" fill="none" stroke="#222" stroke-width="3" />
    <!-- Progress circle filled -->
    <circle cx="105" cy="125" r="18" fill="none" stroke="#58a6ff" stroke-width="3" stroke-dasharray="113" stroke-dashoffset="35" stroke-linecap="round" />
    <text x="105" y="129" font-family="'Orbitron', sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">70%</text>
  </g>

</svg>
